<!-- Holiday Card Component for Webflow -->
<!-- Add this to an Embed element in Webflow -->

<!-- Typekit Font -->
<link rel="stylesheet" href="https://use.typekit.net/jnh3rud.css">

<div class="hc-wrapper">
  <div class="hc-card">
    <div class="hc-media" id="hc-media">
      <!-- Main Illustration -->
      <img
        src="https://cdn.prod.website-files.com/691b683abe1e01c80cbaeb7b/691d20e01f7efc993d43c831_Vector%20_%20Holiday%20Card%20Illustration%20(2).svg"
        alt="Holiday card illustration"
        class="hc-image"
      />

      <!-- Hotspot 1: Bakery -->
      <button
        class="hc-hotspot"
        style="top: 35%; left: 25%;"
        data-hotspot="bakery"
        aria-label="View Bakery details"
      ></button>

      <!-- Hotspot 2: Bookshop -->
      <button
        class="hc-hotspot"
        style="top: 50%; left: 70%;"
        data-hotspot="bookshop"
        aria-label="View Bookshop details"
      ></button>

      <!-- Hotspot 3: Bar -->
      <button
        class="hc-hotspot"
        style="top: 65%; left: 45%;"
        data-hotspot="bar"
        aria-label="View Bar details"
      ></button>

      <!-- Back button -->
      <button class="hc-back-button" id="hc-back-button">
        <span>←</span>
        Back to full scene
      </button>
    </div>
  </div>

  <!-- Overlay -->
  <div class="hc-overlay" id="hc-overlay"></div>

  <!-- Intro Popup -->
  <div class="hc-popup hc-popup-intro" id="hc-popup-intro">
    <div class="hc-popup-inner-intro">
      <div class="hc-popup-header">
        <span class="hc-popup-label" id="hc-intro-label"></span>
        <button class="hc-popup-close" aria-label="Close">✕</button>
      </div>
      <h2 class="hc-popup-title" id="hc-intro-title"></h2>
      <p class="hc-popup-text" id="hc-intro-text"></p>
      <button class="hc-popup-button-primary" id="hc-intro-button"></button>
    </div>
  </div>

  <!-- Explore Popup -->
  <div class="hc-popup hc-popup-explore" id="hc-popup-explore">
    <div class="hc-popup-inner-explore">
      <!-- Header -->
      <div class="hc-explore-header">
        <button class="hc-explore-back" id="hc-explore-back">
          <span>←</span> Back
        </button>
        <span class="hc-explore-counter" id="hc-explore-counter">1 - 3</span>
        <button class="hc-popup-close" aria-label="Close">✕</button>
      </div>

      <!-- Card Content -->
      <div class="hc-explore-content">
        <div class="hc-card-container">
          <!-- Card Image -->
          <div class="hc-card-img">
            <div class="hc-explore-icon" id="hc-explore-icon"></div>
          </div>
          <!-- Card Content -->
          <div class="hc-card-content">
            <div class="hc-card-header">
              <span class="hc-card-category" id="hc-card-category"></span>
            </div>
            <div class="hc-card-body">
              <h3 class="hc-card-title" id="hc-card-title"></h3>
              <p class="hc-card-description" id="hc-card-description"></p>
            </div>
            <div class="hc-card-footer">
              <button class="hc-card-cta" id="hc-card-cta">
                <span class="hc-cta-text"></span>
                <svg class="hc-card-arrow" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 28 28" fill="none">
                  <path d="M7.39667 19.005L17.0683 9.33333L10.5583 9.33333C10.2489 9.33333 9.95217 9.21042 9.73338 8.99162C9.51458 8.77283 9.39167 8.47609 9.39167 8.16667C9.39167 7.85725 9.51458 7.5605 9.73338 7.34171C9.95217 7.12292 10.2489 7 10.5583 7L19.8333 7C20.1428 7 20.4395 7.12292 20.6583 7.34171C20.8771 7.5605 21 7.85725 21 8.16667L21 17.5C21 17.8094 20.8771 18.1062 20.6583 18.325C20.4395 18.5438 20.1428 18.6667 19.8333 18.6667H19.8917C19.5822 18.6667 19.2855 18.5438 19.0667 18.325C18.8479 18.1062 18.725 17.8094 18.725 17.5L18.725 11.025L9.08833 20.6617C8.97988 20.771 8.85084 20.8578 8.70867 20.917C8.5665 20.9763 8.41401 21.0068 8.26 21.0068C8.10599 21.0068 7.9535 20.9763 7.81133 20.917C7.66916 20.8578 7.54012 20.771 7.43167 20.6617C7.31999 20.5555 7.23045 20.4283 7.16819 20.2874C7.10594 20.1465 7.07221 19.9946 7.06896 19.8406C7.0657 19.6866 7.09299 19.5335 7.14923 19.39C7.20548 19.2466 7.28958 19.1158 7.39667 19.005Z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="hc-explore-nav">
        <button class="hc-nav-arrow" id="hc-nav-prev">‹</button>
        <div class="hc-nav-dots" id="hc-nav-dots"></div>
        <button class="hc-nav-arrow" id="hc-nav-next">›</button>
      </div>
    </div>
  </div>

  <!-- Snowflakes -->
  <div class="hc-snowflakes" id="hc-snowflakes"></div>

  <!-- Particles -->
  <div class="hc-particles" id="hc-particles"></div>
</div>

<style>
  /* Wrapper */
  .hc-wrapper {
    position: relative;
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Main Card */
  .hc-card {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #1a2332 100%);
  }

  .hc-image {
    width: 100%;
    height: auto;
    display: block;
    vertical-align: bottom;
    margin: 0;
    padding: 0;
  }

  .hc-media {
    position: relative;
    width: 100%;
    transform-origin: 0 0;
    transform: translate(0px, 0px) scale(1);
    transition: transform 0.6s ease-in-out;
    line-height: 0;
    font-size: 0;
  }

  /* Hotspots */
  .hc-hotspot {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 999px;
    border: 1.5px solid rgba(165, 216, 255, 0.8);
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(165, 216, 255, 0.6) 30%, rgba(99, 179, 237, 0.3) 60%, transparent 80%);
    box-shadow:
      0 0 8px rgba(165, 216, 255, 0.9),
      0 0 16px rgba(99, 179, 237, 0.7),
      0 0 32px rgba(59, 130, 246, 0.5),
      0 0 48px rgba(37, 99, 235, 0.3);
    cursor: pointer;
    transform: translate(-50%, -50%);
    z-index: 3;
    animation:
      hc-sparkle-pulse 3s ease-in-out infinite,
      hc-sparkle-twinkle 4s ease-in-out infinite alternate,
      hc-sparkle-shimmer 2s linear infinite;
  }

  .hc-hotspot::before,
  .hc-hotspot::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 1) 0%, rgba(165, 216, 255, 0.9) 100%);
    border-radius: 999px;
    width: 2.5px;
    height: 18px;
    pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(165, 216, 255, 0.8));
  }

  .hc-hotspot::before {
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .hc-hotspot::after {
    transform: translate(-50%, -50%) rotate(-45deg);
  }

  .hc-hotspot:hover {
    transform: translate(-50%, -50%) scale(1.2);
    border-color: rgba(255, 255, 255, 0.95);
    box-shadow:
      0 0 12px rgba(165, 216, 255, 1),
      0 0 24px rgba(99, 179, 237, 0.9),
      0 0 40px rgba(59, 130, 246, 0.7),
      0 0 60px rgba(37, 99, 235, 0.5);
  }

  @keyframes hc-sparkle-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes hc-sparkle-twinkle {
    0% {
      box-shadow:
        0 0 8px rgba(165, 216, 255, 0.9),
        0 0 16px rgba(99, 179, 237, 0.7),
        0 0 32px rgba(59, 130, 246, 0.5),
        0 0 48px rgba(37, 99, 235, 0.3);
      opacity: 0.95;
    }
    50% {
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.95),
        0 0 24px rgba(165, 216, 255, 0.9),
        0 0 40px rgba(99, 179, 237, 0.7),
        0 0 60px rgba(59, 130, 246, 0.5);
      opacity: 1;
    }
    100% {
      box-shadow:
        0 0 6px rgba(165, 216, 255, 0.85),
        0 0 14px rgba(99, 179, 237, 0.65),
        0 0 28px rgba(59, 130, 246, 0.45),
        0 0 42px rgba(37, 99, 235, 0.25);
      opacity: 0.9;
    }
  }

  @keyframes hc-sparkle-shimmer {
    0% { filter: brightness(1) hue-rotate(0deg); }
    25% { filter: brightness(1.1) hue-rotate(5deg); }
    50% { filter: brightness(1.2) hue-rotate(0deg); }
    75% { filter: brightness(1.1) hue-rotate(-5deg); }
    100% { filter: brightness(1) hue-rotate(0deg); }
  }

  /* Back Button */
  .hc-back-button {
    position: absolute;
    left: 20px;
    bottom: 20px;
    padding: 10px 20px;
    background: rgba(15, 23, 42, 0.4);
    color: #e0f2fe;
    border-radius: 999px;
    font-size: 13px;
    border: 1px solid rgba(165, 216, 255, 0.3);
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    z-index: 4;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .hc-back-button:hover {
    background: rgba(15, 23, 42, 0.6);
    border-color: rgba(165, 216, 255, 0.5);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  .hc-back-button.hc-visible {
    display: inline-flex;
  }

  /* Overlay */
  .hc-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(15, 23, 42, 0.75) 0%, rgba(10, 15, 30, 0.9) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 50;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .hc-overlay.hc-visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* Popups Base */
  .hc-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.92);
    opacity: 0;
    pointer-events: none;
    z-index: 60;
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .hc-popup.hc-visible {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Intro Popup */
  .hc-popup-inner-intro {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 249, 255, 0.9) 100%);
    border-radius: 1.5rem;
    border: 1.5px solid rgba(165, 216, 255, 0.3);
    box-shadow:
      0 30px 60px -15px rgba(15, 23, 42, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 0 40px rgba(59, 130, 246, 0.15);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    padding: 2rem;
    width: 90vw;
    max-width: 26rem;
    position: relative;
    overflow: hidden;
  }

  .hc-popup-inner-intro::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(165, 216, 255, 0.5), transparent);
  }

  .hc-popup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .hc-popup-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: #3b82f6;
    font-weight: 600;
    opacity: 0.8;
  }

  .hc-popup-close {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.15);
    color: #3b82f6;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hc-popup-close:hover {
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(59, 130, 246, 0.3);
    transform: rotate(90deg);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
  }

  .hc-popup-title {
    margin: 0 0 1rem;
    font-size: 1.75rem;
    font-weight: 400;
    font-family: 'charcuterie-block', serif;
    color: #1e293b;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  .hc-popup-text {
    margin: 0 0 1.5rem;
    font-size: 1rem;
    line-height: 1.8;
    color: #475569;
  }

  .hc-popup-button-primary {
    padding: 0.75rem 1.75rem;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #ffffff;
    border: none;
    border-radius: 999px;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  .hc-popup-button-primary:hover {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
  }

  /* Explore Popup */
  .hc-popup-inner-explore {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 249, 255, 0.9) 100%);
    border-radius: 1.5rem;
    border: 1.5px solid rgba(165, 216, 255, 0.3);
    box-shadow:
      0 30px 60px -15px rgba(15, 23, 42, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 0 40px rgba(59, 130, 246, 0.15);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    width: 90vw;
    max-width: 32rem;
    overflow: hidden;
    position: relative;
  }

  .hc-popup-inner-explore::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(165, 216, 255, 0.5), transparent);
  }

  .hc-explore-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid rgba(59, 130, 246, 0.1);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, transparent 100%);
  }

  .hc-explore-back {
    font-size: 0.875rem;
    color: #3b82f6;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hc-explore-back:hover {
    color: #2563eb;
    transform: translateX(-2px);
  }

  .hc-explore-counter {
    font-size: 0.75rem;
    color: #64748b;
    letter-spacing: 0.15em;
    font-weight: 600;
  }

  .hc-explore-content {
    padding: 2rem;
  }

  .hc-card-container {
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 1.25rem;
    overflow: hidden;
    border: 1.5px solid rgba(165, 216, 255, 0.25);
    box-shadow:
      0 12px 40px rgba(59, 130, 246, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: rotate(-0.5deg);
    animation: hc-card-enter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes hc-card-enter {
    0% {
      opacity: 0;
      transform: rotate(-0.5deg) translateY(20px) scale(0.95);
    }
    100% {
      opacity: 1;
      transform: rotate(-0.5deg) translateY(0) scale(1);
    }
  }

  .hc-card-container:hover {
    transform: translateY(-6px) rotate(0deg);
    box-shadow:
      0 24px 70px rgba(59, 130, 246, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
    border-color: rgba(165, 216, 255, 0.5);
  }

  /* Card Image Section */
  .hc-card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(99, 179, 237, 0.04) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .hc-card-img::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(165, 216, 255, 0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .hc-explore-icon {
    font-size: 5rem;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.2));
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .hc-card-container:hover .hc-explore-icon {
    transform: scale(1.1) rotate(5deg);
    filter: drop-shadow(0 8px 20px rgba(59, 130, 246, 0.3));
  }

  /* Card Content Section */
  .hc-card-content {
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .hc-card-header {
    margin-bottom: 0.5rem;
  }

  .hc-card-category {
    display: inline-block;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #3b82f6;
    background: rgba(59, 130, 246, 0.1);
    padding: 0.375rem 0.875rem;
    border-radius: 0.5rem;
    font-weight: 600;
    border: 1px solid rgba(59, 130, 246, 0.2);
  }

  .hc-card-body {
    flex: 1;
  }

  .hc-card-title {
    margin: 0 0 0.75rem;
    font-size: 1.75rem;
    font-weight: 400;
    font-family: 'charcuterie-block', serif;
    color: #1e293b;
    letter-spacing: 0.01em;
    line-height: 1.3;
  }

  .hc-card-description {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.75;
    color: #475569;
  }

  .hc-card-footer {
    margin-top: 0.5rem;
  }

  .hc-card-cta {
    font-size: 0.9375rem;
    font-weight: 500;
    color: #1e293b;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hc-card-cta:hover {
    color: #3b82f6;
    gap: 0.75rem;
  }

  .hc-card-arrow {
    width: 20px;
    height: 20px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hc-card-cta:hover .hc-card-arrow {
    transform: translate(2px, -2px);
    color: #3b82f6;
  }

  /* Navigation */
  .hc-explore-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    border-top: 1px solid rgba(59, 130, 246, 0.1);
    gap: 1.25rem;
    background: linear-gradient(0deg, rgba(255, 255, 255, 0.5) 0%, transparent 100%);
  }

  .hc-nav-arrow {
    width: 3rem;
    height: 3rem;
    border-radius: 999px;
    border: 1.5px solid rgba(59, 130, 246, 0.25);
    background: rgba(59, 130, 246, 0.08);
    color: #3b82f6;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hc-nav-arrow:hover:not(:disabled) {
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    transform: scale(1.05);
  }

  .hc-nav-arrow:disabled {
    border-color: rgba(59, 130, 246, 0.1);
    color: rgba(59, 130, 246, 0.3);
    cursor: not-allowed;
    background: transparent;
  }

  .hc-nav-dots {
    display: flex;
    gap: 0.625rem;
  }

  .hc-nav-dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 999px;
    background: rgba(59, 130, 246, 0.3);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .hc-nav-dot:hover {
    background: rgba(59, 130, 246, 0.5);
    transform: scale(1.15);
  }

  .hc-nav-dot.hc-active {
    background: #3b82f6;
    transform: scale(1.3);
    box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
  }

  /* Snowflakes */
  .hc-snowflakes {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .hc-snowflake {
    position: absolute;
    color: #fff;
    font-size: 1rem;
    opacity: 0.8;
    animation: hc-fall linear infinite;
    text-shadow: 0 0 8px rgba(165, 216, 255, 0.8);
  }

  @keyframes hc-fall {
    0% {
      transform: translateY(-10vh) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 0.8;
    }
    90% {
      opacity: 0.8;
    }
    100% {
      transform: translateY(110vh) translateX(var(--drift)) rotate(360deg);
      opacity: 0;
    }
  }

  /* Particles */
  .hc-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    overflow: hidden;
  }

  .hc-particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(165, 216, 255, 0.9) 0%, rgba(99, 179, 237, 0.5) 50%, transparent 100%);
    box-shadow: 0 0 8px rgba(165, 216, 255, 0.8);
    animation: hc-float ease-in-out infinite;
  }

  @keyframes hc-float {
    0%, 100% {
      transform: translateY(0) translateX(0) scale(1);
      opacity: 0.3;
    }
    50% {
      transform: translateY(-20px) translateX(10px) scale(1.2);
      opacity: 0.8;
    }
  }

  /* Twinkling stars */
  @keyframes hc-twinkle-star {
    0%, 100% {
      opacity: 0.3;
      transform: scale(1);
    }
    50% {
      opacity: 1;
      transform: scale(1.5);
    }
  }

  .hc-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
    animation: hc-twinkle-star ease-in-out infinite;
  }
</style>

<script>
(function() {
  // Data
  const hotspotData = {
    bakery: {
      label: 'Bakery',
      scale: 2.3,
      intro: {
        title: 'The Holiday Bakery',
        text: 'A warm corner filled with the scent of cinnamon and fresh bread. The baker has been up since dawn, folding butter into dough.',
        buttonText: 'Explore Recipes'
      },
      cards: [
        {
          category: 'Bread',
          title: 'Holiday Brioche',
          description: 'A slow-risen brioche with orange zest, cranberries, and a ribbon of cinnamon sugar woven through each layer. Best served warm, torn by hand, with salted butter that melts into every crevice. The dough requires patience—a full overnight rise—but the result is worth every hour of waiting. This recipe has been passed down through three generations of bakers, each one adding their own small refinements while preserving the essential character of the original.',
          cta: 'View Recipe',
          icon: '🥐'
        },
        {
          category: 'Cookies',
          title: 'Cinnamon Stars',
          description: 'Crisp, airy cookies dusted in vanilla sugar and shaped like perfect six-pointed stars. They snap cleanly when bitten and dissolve on the tongue. Perfect for dipping into coffee while watching the snow fall outside. The secret is in the temperature—everything must stay cold until the moment they enter the oven. We roll the dough between sheets of parchment, freeze it solid, then cut the stars quickly before the butter softens.',
          cta: 'View Recipe',
          icon: '🥐'
        },
        {
          category: 'Pastry',
          title: 'Almond Croissants',
          description: 'Flaky layers filled with homemade frangipane cream and topped with sliced almonds and a light glaze that cracks when you bite through. These are made from yesterday\'s croissants, soaked in almond syrup and given new life. A perfect example of how the best things often come from what might otherwise be discarded. The frangipane is made fresh each morning with blanched almonds ground to a fine powder.',
          cta: 'View Recipe',
          icon: '🥐'
        }
      ]
    },
    bookshop: {
      label: 'Bookshop',
      scale: 2.4,
      intro: {
        title: 'The Corner Bookshop',
        text: 'Shelves stacked floor to ceiling with well-loved volumes. The owner leaves out tea and shortbread for browsers.',
        buttonText: 'Browse Collection'
      },
      cards: [
        {
          category: 'Fiction',
          title: 'Winter Reading List',
          description: 'Small, quiet novels meant to be read in one sitting, under a blanket, with something warm to drink. These are stories of solitude and connection, of long nights and unexpected kindnesses. Each one has been selected for its ability to make the reader feel less alone, even while sitting in silence. The owner has written notes in the margins of every copy, sharing her own thoughts with strangers who might need them.',
          cta: 'See List',
          icon: '📚'
        },
        {
          category: 'Cookbooks',
          title: 'Baking Classics',
          description: 'Dog-eared baking books with handwritten notes in the margins and recipes borrowed from grandparents and great-aunts. Stained pages tell the story of years spent in kitchens, learning through failure and triumph. These aren\'t just cookbooks—they\'re family histories, preserved in flour and sugar and the careful measurements of those who came before. Open any one and you\'ll find a story between the recipes.',
          cta: 'Explore',
          icon: '📚'
        },
        {
          category: 'Poetry',
          title: 'Seasonal Verse',
          description: 'Collections of poems about frost, firelight, and the quiet magic of the shortest days. Words that capture the feeling of watching snow fall, of sitting by a window in the late afternoon when the light turns golden. Poetry for people who think they don\'t like poetry—accessible, moving, and utterly human. Read one each morning with your coffee and see how it changes the shape of your day.',
          cta: 'Read More',
          icon: '📚'
        }
      ]
    },
    bar: {
      label: 'Bar',
      scale: 2.2,
      intro: {
        title: 'The Midnight Bar',
        text: 'A dimly lit space where the bartender knows everyone\'s name. The specialty is warm drinks with a kick.',
        buttonText: 'Indulge'
      },
      cards: [
        {
          category: 'Aperitif',
          title: 'Midnight Negroni',
          description: 'The classic, served with a charred orange peel that releases its oils in a fragrant burst, and a single large ice cube that melts slowly, opening the drink as the evening progresses. Equal parts gin, Campari, and sweet vermouth, stirred until the glass frosts. Simple in composition, complex in character—like the best conversations you\'ll have while drinking it.',
          cta: 'View Recipe',
          icon: '🍸'
        },
        {
          category: 'Hot Cocktail',
          title: 'Spiced Toddy',
          description: 'Whiskey, honey, lemon, and a cinnamon stick—the remedy for any winter evening and the cure for whatever ails you. The water must be hot but not boiling, and the honey should be stirred until it dissolves completely. Served in a glass mug that warms your hands while you drink. There\'s a reason this recipe has survived centuries. It works.',
          cta: 'View Recipe',
          icon: '🍸'
        },
        {
          category: 'Signature',
          title: 'Velvet Evening',
          description: 'A house creation with aged rum, Madagascar vanilla, and a hint of cold-brew coffee. Served in a warmed glass with a single coffee bean floating on top. Rich and smooth, with a finish that lingers. The bartender developed this over three winters, adjusting the proportions until it was exactly right. Now it\'s what everyone orders on their first visit—and every visit after.',
          cta: 'View Recipe',
          icon: '🍸'
        }
      ]
    }
  };

  // State
  let activeHotspot = null;
  let currentCardIndex = 0;

  // Elements
  const media = document.getElementById('hc-media');
  const overlay = document.getElementById('hc-overlay');
  const backButton = document.getElementById('hc-back-button');
  const introPopup = document.getElementById('hc-popup-intro');
  const explorePopup = document.getElementById('hc-popup-explore');
  const hotspots = document.querySelectorAll('.hc-hotspot');

  // Intro elements
  const introLabel = document.getElementById('hc-intro-label');
  const introTitle = document.getElementById('hc-intro-title');
  const introText = document.getElementById('hc-intro-text');
  const introButton = document.getElementById('hc-intro-button');

  // Explore elements
  const exploreCounter = document.getElementById('hc-explore-counter');
  const exploreIcon = document.getElementById('hc-explore-icon');
  const cardCategory = document.getElementById('hc-card-category');
  const cardTitle = document.getElementById('hc-card-title');
  const cardDescription = document.getElementById('hc-card-description');
  const cardCta = document.getElementById('hc-card-cta');
  const navDots = document.getElementById('hc-nav-dots');
  const navPrev = document.getElementById('hc-nav-prev');
  const navNext = document.getElementById('hc-nav-next');

  // Functions
  function zoomToHotspot(hotspotEl, data) {
    const mediaRect = media.getBoundingClientRect();
    const scale = data.scale;

    const style = hotspotEl.style;
    const hotspotX = parseFloat(style.left) / 100;
    const hotspotY = parseFloat(style.top) / 100;

    const targetX = 0.4;
    const targetY = 0.5;

    const tx = (targetX - scale * hotspotX) * mediaRect.width;
    const ty = (targetY - scale * hotspotY) * mediaRect.height;

    media.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function resetView() {
    media.style.transform = 'translate(0px, 0px) scale(1)';
    backButton.classList.remove('hc-visible');
    overlay.classList.remove('hc-visible');
    introPopup.classList.remove('hc-visible');
    explorePopup.classList.remove('hc-visible');
    activeHotspot = null;
    currentCardIndex = 0;
  }

  function showIntro(hotspotId) {
    const data = hotspotData[hotspotId];
    activeHotspot = hotspotId;
    currentCardIndex = 0;

    introLabel.textContent = data.label;
    introTitle.textContent = data.intro.title;
    introText.textContent = data.intro.text;
    introButton.textContent = data.intro.buttonText;

    overlay.classList.add('hc-visible');
    introPopup.classList.add('hc-visible');
    explorePopup.classList.remove('hc-visible');
    backButton.classList.add('hc-visible');
  }

  function showExplore() {
    if (!activeHotspot) return;
    const data = hotspotData[activeHotspot];

    introPopup.classList.remove('hc-visible');
    explorePopup.classList.add('hc-visible');

    // Build dots
    navDots.innerHTML = '';
    data.cards.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'hc-nav-dot' + (i === 0 ? ' hc-active' : '');
      dot.addEventListener('click', () => goToCard(i));
      navDots.appendChild(dot);
    });

    updateCard();
  }

  function updateCard() {
    if (!activeHotspot) return;
    const data = hotspotData[activeHotspot];
    const card = data.cards[currentCardIndex];

    exploreCounter.textContent = `${currentCardIndex + 1} - ${data.cards.length}`;
    exploreIcon.textContent = card.icon;
    cardCategory.textContent = card.category;
    cardTitle.textContent = card.title;
    cardDescription.textContent = card.description;
    cardCta.querySelector('.hc-cta-text').textContent = card.cta;

    // Update dots
    const dots = navDots.querySelectorAll('.hc-nav-dot');
    dots.forEach((dot, i) => {
      dot.classList.toggle('hc-active', i === currentCardIndex);
    });

    // Update arrows
    navPrev.disabled = currentCardIndex === 0;
    navNext.disabled = currentCardIndex === data.cards.length - 1;
  }

  function goToCard(index) {
    currentCardIndex = index;
    updateCard();
  }

  // Event listeners
  hotspots.forEach(hotspot => {
    hotspot.addEventListener('click', () => {
      const hotspotId = hotspot.getAttribute('data-hotspot');
      const data = hotspotData[hotspotId];
      zoomToHotspot(hotspot, data);
      setTimeout(() => showIntro(hotspotId), 500);
    });
  });

  backButton.addEventListener('click', resetView);
  overlay.addEventListener('click', resetView);

  document.querySelectorAll('.hc-popup-close').forEach(btn => {
    btn.addEventListener('click', resetView);
  });

  introButton.addEventListener('click', showExplore);

  document.getElementById('hc-explore-back').addEventListener('click', () => {
    explorePopup.classList.remove('hc-visible');
    introPopup.classList.add('hc-visible');
  });

  navPrev.addEventListener('click', () => {
    if (currentCardIndex > 0) {
      currentCardIndex--;
      updateCard();
    }
  });

  navNext.addEventListener('click', () => {
    if (activeHotspot && currentCardIndex < hotspotData[activeHotspot].cards.length - 1) {
      currentCardIndex++;
      updateCard();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') resetView();
  });

  // Create snowflakes
  function createSnowflakes() {
    const container = document.getElementById('hc-snowflakes');
    const snowflakeCount = 30;

    for (let i = 0; i < snowflakeCount; i++) {
      const snowflake = document.createElement('div');
      snowflake.className = 'hc-snowflake';
      snowflake.textContent = '❄';
      snowflake.style.left = `${Math.random() * 100}%`;
      snowflake.style.setProperty('--drift', `${(Math.random() - 0.5) * 100}px`);
      snowflake.style.animationDuration = `${8 + Math.random() * 10}s`;
      snowflake.style.animationDelay = `${Math.random() * 5}s`;
      snowflake.style.fontSize = `${0.5 + Math.random() * 1}rem`;
      container.appendChild(snowflake);
    }
  }

  // Create particles
  function createParticles() {
    const container = document.getElementById('hc-particles');
    const particleCount = 40;

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.className = 'hc-particle';
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.top = `${Math.random() * 100}%`;
      particle.style.animationDuration = `${3 + Math.random() * 4}s`;
      particle.style.animationDelay = `${Math.random() * 3}s`;
      container.appendChild(particle);
    }

    // Add some twinkling stars
    for (let i = 0; i < 20; i++) {
      const star = document.createElement('div');
      star.className = 'hc-star';
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.animationDuration = `${2 + Math.random() * 3}s`;
      star.style.animationDelay = `${Math.random() * 2}s`;
      container.appendChild(star);
    }
  }

  // Initialize
  createSnowflakes();
  createParticles();
})();
</script>
